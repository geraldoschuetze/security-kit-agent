<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" width="1280" height="650" role="img" aria-label="How one /security-scan runs: a pre-check for the four tools, then four dimensions in parallel isolated contexts — sca-scanner with Trivy and OSV-Scanner, sast-scanner with Semgrep, secrets-scanner with Gitleaks, and a semantic reviewer working by reasoning — cross-validated against each other, triaged for false positives, and written to a single report with a verdict.">
