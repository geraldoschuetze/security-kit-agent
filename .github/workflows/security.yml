# Auto-scan de segurança deste repositório + exemplo de uso do reutilizável.
# Copie este arquivo para qualquer outro repo trocando o `uses:` pela referência
# remota:  geraldoschuetze/claude-security-kit/.github/workflows/security-reusable.yml@v1

name: security

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Fase I: re-scan semanal (segunda 06:00 UTC)
  workflow_dispatch:
    inputs:
      dast_url:
        description: "URL p/ ZAP baseline (opcional)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security-reusable.yml
    with:
      fail_on_severity: CRITICAL
      dast_url: ${{ github.event.inputs.dast_url || '' }}
